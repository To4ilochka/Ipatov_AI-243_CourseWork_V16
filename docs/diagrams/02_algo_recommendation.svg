   <g id="text_1">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0f172a" x="305.82" y="37.566625" transform="rotate(-0 305.82 37.566625)">Початок</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(171.157156 75.460064)">Завантажити профіль волонтера v (місто, навички L_v)</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(194.503594 86.634786)">та активні заявки для виключення дублікатів</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(189.877 120.909058)">Вибрати відкриті завдання t активних ініціатив</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(181.714156 131.630479)">(approvedCount &lt; maxVolunteers, deadlineAt &gt; now)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(255.820969 181.206621)">Є наступне завдання t</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(258.262219 190.485129)">у списку кандидатів?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(183.510313 227.097983)">Обчислити зважене покриття навичок C_skill(v, t),</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(161.617188 238.075279)">множник локації C_loc(v, t) та фактор терміновості C_urg(t)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(258.854813 290.574152)">Відсутня хоча б одна</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(257.863875 299.852661)">обов'язкова навичка?</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(78.993638 332.866435)">Встановити штрафний множник</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(73.563598 342.772096)">P_mand = 0,35 та прапорець уваги</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(399.6798 332.866435)">Штраф не застосовується:</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(405.18355 342.772096)">множник P_mand = 1,00</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(147.521063 383.517127)">Розрахувати S(v, t) = 100 · (α·C_skill + β·C_loc + γ·C_urg) · P_mand</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(145.741438 394.494423)">і сформувати текстове пояснення RecommendationExplanationDto</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(170.986813 439.086777)">Відсортувати результати за спаданням S(v, t), C_urg(t),</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(166.981219 450.064073)">зростанням deadlineAt та повернути топ-K рекомендацій</text>
   </g>
