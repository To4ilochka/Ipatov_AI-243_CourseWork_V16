   <g id="text_1">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #475569" x="321.272308" y="421.117646" transform="rotate(-0 321.272308 421.117646)">Усі форми захищені CSRF-токеном і блокуванням повторного натискання кнопки під час відправлення запиту.</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(83.349668 51.336364)">UI-01 Публічний каталог завдань</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(98.50109 60.956476)">пошук, фільтри, пагінація,</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(82.402825 70.913992)">відображення порожньої вибірки</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(422.538977 51.266536)">UI-02 Вхід / Реєстрація</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(410.414508 61.15999)">перевірка облікових даних,</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(399.29454 70.716039)">політика паролів NIST ≥15 симв.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(88.151793 145.489198)">UI-03 Картка завдання і форма</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(105.221246 155.045247)">пояснення оцінки S(v,t),</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(86.869262 164.601297)">залишок місць, подання заявки</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(401.142102 145.256433)">UI-04 Стан помилки / конфлікту</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(401.956337 154.876545)">показ помилок полів (400/409),</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(405.022368 164.769999)">збереження введеного тексту</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(104.14884 249.133388)">UI-05 Кабінет волонтера</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(78.259262 258.834732)">навички, рекомендації, мої заявки,</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(98.344137 268.728185)">збереження стану після F5</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(410.315212 249.240847)">UI-06 Панель координатора</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(400.420118 258.796896)">погодження/відхилення заявок,</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(398.072868 268.352946)">авторизовані контакти учасників</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(109.614653 349.676609)">UI-07 Підсумкові звіти</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(94.325496 359.296721)">введення витрачених годин,</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(91.509309 368.998064)">перегляд статусу верифікації</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(408.147977 349.557952)">UI-08 Сторінка відмови (403)</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(402.858337 359.451406)">блокування переходу без прав</text>
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(411.385055 369.11672)">до чужих панелей і записів</text>
