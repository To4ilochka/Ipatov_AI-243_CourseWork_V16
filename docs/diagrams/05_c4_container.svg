   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(278.025078 130.068428)">Веббраузер користувача</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(250.753359 139.974089)">[Client Container: HTML5, CSS Grid, JS]</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(237.571719 150.062155)">Адаптивні форми, валідація полів, таблиці</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(120.167255 248.639926)">Серверний вебзастосунок і REST API</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(123.280692 258.079438)">[Container: Java 21, Spring Boot 3.4]</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(116.372278 267.51895)">Контролери MVC/REST, Spring Security</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(139.931255 276.958462)">(Argon2id), алгоритм S(v,t),</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(122.741536 286.397975)">політика контактів, міграції Flyway</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(419.641341 253.290705)">Спостережуваність і телеметрія</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(427.039552 262.730218)">[Component: Actuator + MDC]</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(424.851919 272.16973)">Перевірки liveness / readiness,</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(430.800989 281.609242)">метрики JVM/CPU, requestId</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(260.513219 349.681132)">Реляційна база даних платформи</text>
