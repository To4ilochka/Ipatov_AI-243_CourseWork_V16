    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(109.4094 60.506908)">[Person]</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(71.072478 70.179495)">Пошук завдань, навички,</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(76.333252 79.852081)">подання заявок і звітів</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(488.660756 50.834321)">Координатор ініціативи</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(523.6686 60.506908)">[Person]</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(488.350803 70.179495)">Керування завданнями,</text>
    <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #0f172a" transform="translate(484.598944 79.852081)">погодження, верифікація</text>
