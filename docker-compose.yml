services:
  postgres:
    image: postgres:16-alpine
    container_name: volunthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-volunthub}
      POSTGRES_USER: ${POSTGRES_USER:-volunthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volunthub_dev_pass}
      TZ: Europe/Kyiv
    ports:
      - "${POSTGRES_PORT:-5446}:5432"
    volumes:
      - volunthub_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-volunthub} -d $${POSTGRES_DB:-volunthub}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volunthub-app
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-volunthub}
      POSTGRES_USER: ${POSTGRES_USER:-volunthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volunthub_dev_pass}
      APP_PORT: 8096
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
    ports:
      - "${APP_PORT:-8096}:8096"

volumes:
  volunthub_pgdata:
